<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCq2omBy8_zdrvIrUFLM3Pfu3V9X9AAWcM",
    authDomain: "new-era-of.firebaseapp.com",
    databaseURL: "https://new-era-of-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "new-era-of",
    storageBucket: "new-era-of.firebasestorage.app",
    messagingSenderId: "1046999936768",
    appId: "1:1046999936768:web:18aa0da7985a39ede64de5",
    measurementId: "G-3HZPN86RKB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window._fbDB = {
    get: async (k) => {
      try {
        const snap = await get(ref(db, 'backdrop/' + k));
        return snap.exists() ? snap.val() : null;
      } catch(e) {
        console.error('FB get error', e);
        throw e;
      }
    },
    set: async (k, v) => {
      try {
        await set(ref(db, 'backdrop/' + k), v);
      } catch(e) {
        console.error('FB set error', e);
        throw e;
      }
    }
  };
  window._fbReady = true;
  window.dispatchEvent(new Event('fb-ready'));
</script>

const DB = {
  get: async k => {
    if (!window._fbDB) throw new Error('Firebase not ready');
    const v = await window._fbDB.get(k);
    return v;
  },
  set: async (k, v) => {
    if (!window._fbDB) throw new Error('Firebase not ready');
    await window._fbDB.set(k, v);
  }
};

  gold:'#D4AF70', goldL:'#EACE8A', goldD:'#A88040', goldBg:'rgba(212,175,112,.12)',

/* ═══════ ATOMS ═══════ */
const Badge = ({c=T.gold,children}) => (
  <span style={{background:c+'22',color:c,borderRadius:20,padding:'2px 10px',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>{children}</span>
);
const Sep   = () => <div style={{borderTop:`1px solid ${T.bdr}`,margin:'14px 0'}}/>;
const Spin  = () => <div style={{width:18,height:18,border:`2px solid ${T.bdr}`,borderTopColor:T.gold,borderRadius:'50%',animation:'spin .7s linear infinite'}}/>;
const Empty = ({msg='ไม่มีข้อมูล'}) => (
  <div style={{textAlign:'center',padding:'36px 0',color:T.muted,fontSize:14}}>
    <div style={{fontSize:28,marginBottom:8}}>📭</div>{msg}
  </div>
);

function Btn({children,onClick,ghost=false,danger=false,sm=false,disabled=false,color,full=false}){
  const c = danger?T.red:(color||T.gold);
  return (
    <button onClick={onClick} disabled={disabled} style={{
      background:ghost||danger?'transparent':c, color:ghost||danger?c:T.bg,
      border:`1px solid ${c}`, borderRadius:8, padding:sm?'5px 12px':'8px 18px',
      fontSize:sm?12:14, fontWeight:600, cursor:disabled?'not-allowed':'pointer',
      opacity:disabled?.5:1, transition:'all .12s', whiteSpace:'nowrap', lineHeight:1.5,
      width:full?'100%':'auto'
    }}>{children}</button>
  );
}

function Inp({label,type='text',value,onChange,placeholder,min,step,options,rows=3,maxLength}){
  const base = {background:T.s2,border:`1px solid ${T.bdr}`,borderRadius:8,padding:'9px 12px',color:T.text,fontSize:14,width:'100%',outline:'none',fontFamily:T.ff};
  return (
    <div style={{display:'flex',flexDirection:'column',gap:5}}>
      {label && <label style={{fontSize:12,color:T.muted,letterSpacing:'.04em'}}>{label}</label>}
      {type==='textarea' ? <textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows} style={{...base,resize:'vertical'}}/>
       :type==='select'  ? <select value={value} onChange={onChange} style={base}>{options?.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>
       :<input type={type} value={value} onChange={onChange} placeholder={placeholder} min={min} step={step} maxLength={maxLength} style={base}/>}
    </div>
  );
}

function Card({children,style={},onClick}){
  return (
    <div onClick={onClick} style={{background:T.s1,border:`1px solid ${T.bdr}`,borderRadius:14,padding:'18px 22px',marginBottom:14,
      cursor:onClick?'pointer':'default',transition:'all .15s',...style}}
      onMouseEnter={e=>{if(onClick){e.currentTarget.style.borderColor=T.bdrH;e.currentTarget.style.transform='translateY(-1px)';}}}
      onMouseLeave={e=>{if(onClick){e.currentTarget.style.borderColor=T.bdr;e.currentTarget.style.transform='';}}}
    >{children}</div>
  );
}

function Modal({title,children,onClose,width=540}){
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:T.s1,border:`1px solid ${T.bdr}`,borderRadius:16,padding:28,width:'100%',maxWidth:width,maxHeight:'92vh',overflow:'auto',animation:'fadeIn .2s ease'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2 style={{fontSize:17,fontWeight:700,color:T.gold}}>{title}</h2>
          <button onClick={onClose} style={{background:'none',border:'none',color:T.muted,fontSize:22,cursor:'pointer',lineHeight:1}}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function SlipUpload({onUpload,existing}){
  const ref2 = useRef();
  return (
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      <input type="file" accept="image/*" ref={ref2} style={{display:'none'}}
        onChange={e=>{
          const f = e.target.files[0];
          if(!f) return;
          if(f.size>3*1024*1024){alert('ไฟล์ใหญ่เกิน 3MB');return;}
          const r = new FileReader();
          r.onload = ev => onUpload(ev.target.result);
          r.readAsDataURL(f);
        }}/>
      <Btn sm ghost onClick={()=>ref2.current.click()}>📎 อัปโหลดสลิป</Btn>
      {existing && <a href={existing} target="_blank" rel="noreferrer" style={{color:T.blue,fontSize:12}}>🖼 ดูสลิป</a>}
    </div>
  );
}

function StatCard({icon,label,value,sub,color=T.gold}){
  return (
    <div style={{background:T.s1,border:`1px solid ${T.bdr}`,borderRadius:14,padding:'18px 20px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
        <span style={{fontSize:11,color:T.muted,textTransform:'uppercase',letterSpacing:'.06em'}}>{label}</span>
        <span style={{fontSize:20,opacity:.65}}>{icon}</span>
      </div>
      <div style={{fontSize:22,fontWeight:700,color}}>{value}</div>
      {sub && <div style={{fontSize:12,color:T.muted,marginTop:4}}>{sub}</div>}
    </div>
  );
}

function exportCSV(rows,filename){
  const content = '\uFEFF'+rows.map(r=>r.map(c=>`"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([content],{type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ═══════ LOGIN ═══════ */
function LoginPage({users,onLogin}){
  const [sel,setSel]=useState(null);
  const [pin,setPin]=useState('');
  const [err,setErr]=useState('');
  const attempt=()=>{
    const u=users.find(x=>x.id===sel);
    if(!u){setErr('กรุณาเลือกผู้ใช้');return;}
    if(u.pin!==pin){setErr('PIN ไม่ถูกต้อง');setPin('');return;}
    onLogin(u);
  };
  return (
    <div style={{minHeight:'100vh',background:T.bg,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{width:'100%',maxWidth:380,textAlign:'center'}}>
        <div style={{marginBottom:32}}>
          <div style={{fontSize:42,marginBottom:12}}>💐</div>
          <h1 style={{fontSize:26,fontWeight:700,color:T.gold,marginBottom:4}}>Backdrop Studio</h1>
          <p style={{color:T.muted,fontSize:14}}>ระบบบัญชีธุรกิจ</p>
        </div>
        <div style={{background:T.s1,border:`1px solid ${T.bdr}`,borderRadius:16,padding:28}}>
          <p style={{fontSize:13,color:T.muted,marginBottom:14}}>เลือกผู้ใช้งาน</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
            {users.map(u=>(
              <div key={u.id} onClick={()=>{setSel(u.id);setErr('');setPin('');}}
                style={{background:sel===u.id?T.goldBg:T.s2,border:`2px solid ${sel===u.id?T.gold:T.bdr}`,
                  borderRadius:10,padding:'14px 10px',cursor:'pointer',transition:'all .15s',textAlign:'center'}}>
                <div style={{width:36,height:36,borderRadius:'50%',background:u.color+'33',border:`2px solid ${u.color}`,
                  display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 8px',fontSize:16,fontWeight:700,color:u.color}}>
                  {u.name.slice(0,1)}
                </div>
                <div style={{fontSize:13,fontWeight:600,color:sel===u.id?T.gold:T.text}}>{u.name}</div>
                {u.role==='admin'&&<div style={{fontSize:10,color:T.gold,marginTop:2}}>Admin</div>}
              </div>
            ))}
          </div>
          {sel&&(
            <>
              <div style={{marginBottom:12}}>
                <Inp label="PIN (4 หลัก)" type="password" value={pin} onChange={e=>setPin(e.target.value)} placeholder="••••" maxLength={6}/>
              </div>
              {err&&<p style={{color:T.red,fontSize:13,marginBottom:10}}>{err}</p>}
              <Btn full onClick={attempt}>เข้าสู่ระบบ</Btn>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════ DASHBOARD ═══════ */
function Dashboard({state,user,setPage,setJobId}){
  const {users,jobs,divs}=state;
  const totalIncome=jobs.reduce((s,j)=>{
    return s+(j.income?.deposit?.received?Number(j.income.deposit.amount)||0:0)+(j.income?.remaining?.received?Number(j.income.remaining.amount)||0:0);
  },0);
  const totalExp=jobs.reduce((s,j)=>s+(j.expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0),0);
  const totalWages=jobs.reduce((s,j)=>s+(j.expenses||[]).filter(e=>e.category==='labor').reduce((a,e)=>a+Number(e.amount||0),0),0);
  const profit=totalIncome-totalExp;
  const totalDivPaid=divs.reduce((s,d)=>s+(d.shares||[]).reduce((a,x)=>a+Number(x.amount||0),0),0);
  const pending=jobs.filter(j=>j.status!=='done');
  const unpaidJobs=jobs.filter(j=>j.income&&((!j.income.deposit?.received&&j.income.deposit?.amount>0)||(!j.income.remaining?.received&&j.income.remaining?.amount>0)));
  const unreimbursed=jobs.reduce((s,j)=>s+(j.expenses||[]).filter(e=>!e.reimbursed).reduce((a,e)=>a+Number(e.amount||0),0),0);
  return (
    <div>
      <div style={{marginBottom:24}}>
        <h1 style={{fontSize:22,fontWeight:700,color:T.gold}}>ภาพรวมธุรกิจ</h1>
        <p style={{color:T.muted,fontSize:13}}>สรุปสถานะทางการเงินทั้งหมด</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:14,marginBottom:20}}>
        <StatCard icon="💰" label="รายได้รวม" value={baht(totalIncome)} sub={`${jobs.filter(j=>j.income?.deposit?.received||j.income?.remaining?.received).length} งานรับเงินแล้ว`}/>
        <StatCard icon="🧾" label="ค่าใช้จ่ายรวม" value={baht(totalExp)} sub={`ค่าจ้าง ${baht(totalWages)}`} color={T.amber}/>
        <StatCard icon="📈" label="กำไรสุทธิ" value={baht(profit)} color={profit>=0?T.green:T.red}/>
        <StatCard icon="🏷️" label="ยังไม่ได้ปันผล" value={baht(profit-totalDivPaid)} sub="กำไรคงเหลือ" color={T.blue}/>
      </div>
      <Card>
        <h3 style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:14}}>📊 กำไรแต่ละคน (ตามสัดส่วนหุ้น)</h3>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:12}}>
          {users.map(u=>{
            const myDiv=divs.reduce((s,d)=>s+((d.shares||[]).find(x=>x.uid===u.id)?.amount||0),0);
            const myProfit=(profit*u.share/100);
            const myWages=divs.reduce((s,d)=>s+((d.wages||[]).find(x=>x.uid===u.id)?.amount||0),0);
            return (
              <div key={u.id} style={{background:T.s2,border:`1px solid ${T.bdr}`,borderRadius:10,padding:'14px 16px'}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:u.color+'33',border:`2px solid ${u.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:u.color}}>{u.name.slice(0,1)}</div>
                  <div><div style={{fontSize:13,fontWeight:600}}>{u.name}</div><div style={{fontSize:10,color:T.muted}}>{u.share}% หุ้น</div></div>
                </div>
                <div style={{fontSize:15,fontWeight:700,color:T.green}}>{baht(myProfit)}</div>
                <div style={{fontSize:11,color:T.muted,marginTop:2}}>ปันผลแล้ว {baht(myDiv)} · ค่าจ้าง {baht(myWages)}</div>
              </div>
            );
          })}
        </div>
      </Card>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <Card>
          <h3 style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:12}}>💼 งานที่กำลังดำเนินการ ({pending.length})</h3>
          {pending.length===0?<Empty msg="ไม่มีงานค้างอยู่"/>:pending.slice(0,4).map(j=>(
            <div key={j.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${T.bdr}`,cursor:'pointer'}}
              onClick={()=>{setJobId(j.id);setPage('jobs');}}>
              <div>
                <div style={{fontSize:13,fontWeight:600}}>{j.clientName}</div>
                <div style={{fontSize:11,color:T.muted}}>{dtTH(j.eventDate)}</div>
              </div>
              <Badge c={STATUS[j.status]?.color}>{STATUS[j.status]?.label}</Badge>
            </div>
          ))}
        </Card>
        <Card>
          <h3 style={{fontSize:14,fontWeight:700,color:T.text,marginBottom:12}}>⚠️ รายการที่ต้องดำเนินการ</h3>
          {unpaidJobs.length===0&&unreimbursed===0?<Empty msg="ทุกอย่างเรียบร้อย ✅"/>:(
            <>
              {unpaidJobs.slice(0,3).map(j=>(
                <div key={j.id} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0',borderBottom:`1px solid ${T.bdr}`}}>
                  <span style={{fontSize:14}}>💳</span>
                  <div style={{flex:1,fontSize:12}}><span style={{fontWeight:600}}>{j.clientName}</span><span style={{color:T.muted}}> ยังรับเงินไม่ครบ</span></div>
                  <Badge c={T.amber}>ค้างรับ</Badge>
                </div>
              ))}
              {unreimbursed>0&&(
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 0'}}>
                  <span style={{fontSize:14}}>💼</span>
                  <div style={{flex:1,fontSize:12}}>ยอดรอเบิกคืน <span style={{fontWeight:600,color:T.amber}}>{baht(unreimbursed)}</span></div>
                </div>
              )}
            </>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ═══════ JOBS ═══════ */
function Jobs({state,user,save,jobId,setJobId}){
  const [showForm,setShowForm]=useState(false);
  const job=state.jobs.find(j=>j.id===jobId);
  if(job) return <JobDetail job={job} state={state} user={user} save={save} onBack={()=>setJobId(null)}/>;
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h1 style={{fontSize:22,fontWeight:700,color:T.gold}}>งานทั้งหมด</h1><p style={{color:T.muted,fontSize:13}}>{state.jobs.length} งาน</p></div>
        {user.role==='admin'&&<Btn onClick={()=>setShowForm(true)}>+ สร้างงานใหม่</Btn>}
      </div>
      {state.jobs.length===0?<Empty msg="ยังไม่มีงาน กดสร้างงานใหม่ได้เลย"/>:(
        <div>{[...state.jobs].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(j=>{
          const totalInc=(j.income?.deposit?.received?Number(j.income.deposit.amount)||0:0)+(j.income?.remaining?.received?Number(j.income.remaining.amount)||0:0);
          const totalExp=(j.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
          const profit=totalInc-totalExp;
          return (
            <Card key={j.id} onClick={()=>setJobId(j.id)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                    <span style={{fontSize:16,fontWeight:700}}>{j.clientName}</span>
                    <Badge c={STATUS[j.status]?.color}>{STATUS[j.status]?.label}</Badge>
                    {(j.statusAlerts||[]).length>0&&<Badge c={T.amber}>🔔 {j.statusAlerts.length} คนแจ้ง</Badge>}
                  </div>
                  <div style={{fontSize:12,color:T.muted}}>📅 {dtTH(j.eventDate)} {j.theme&&`· ${j.theme}`}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:13,color:T.muted}}>รายได้ {baht(totalInc)} · ค่าใช้จ่าย {baht(totalExp)}</div>
                  <div style={{fontSize:16,fontWeight:700,color:profit>=0?T.green:T.red}}>กำไร {baht(profit)}</div>
                </div>
              </div>
            </Card>
          );
        })}</div>
      )}
      {showForm&&<JobForm state={state} user={user} save={save} onClose={()=>setShowForm(false)}/>}
    </div>
  );
}

function JobForm({state,user,save,onClose,job}){
  const [f,setF]=useState(job||{clientName:'',eventDate:'',agreedPrice:'',theme:'',notes:''});
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const submit=async()=>{
    if(!f.clientName){alert('กรุณากรอกชื่อลูกค้า');return;}
    if(job){
      const jobs=state.jobs.map(j=>j.id===job.id?{...j,...f}:j);
      const hist=[{id:uid(),type:'edit',desc:`แก้ไขงาน: ${f.clientName}`,userId:user.id,jobId:job.id,createdAt:ts()},...state.hist].slice(0,500);
      await save({jobs,hist});
    } else {
      const nj={id:uid(),createdAt:ts(),createdBy:user.id,status:'pending',statusAlerts:[],expenses:[],
        income:{deposit:{amount:0,received:false,slipData:null},remaining:{amount:0,received:false,slipData:null}},
        ...f,agreedPrice:Number(f.agreedPrice)||0};
      const jobs=[...state.jobs,nj];
      const hist=[{id:uid(),type:'create',desc:`สร้างงาน: ${f.clientName}`,userId:user.id,jobId:nj.id,createdAt:ts()},...state.hist].slice(0,500);
      await save({jobs,hist});
    }
    onClose();
  };
  return (
    <Modal title={job?'แก้ไขงาน':'สร้างงานใหม่'} onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Inp label="ชื่อลูกค้า *" value={f.clientName} onChange={set('clientName')} placeholder="ชื่อเจ้าบ่าว/เจ้าสาว"/>
        <Inp label="วันงาน" type="date" value={f.eventDate} onChange={set('eventDate')}/>
        <Inp label="ราคาตกลง (บาท)" type="number" value={f.agreedPrice} onChange={set('agreedPrice')} min="0" step="100" placeholder="0"/>
        <Inp label="ธีมงาน" value={f.theme} onChange={set('theme')} placeholder="เช่น Vintage, Bohemian"/>
        <Inp label="หมายเหตุ" type="textarea" value={f.notes} onChange={set('notes')} placeholder="รายละเอียดเพิ่มเติม"/>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:4}}>
          <Btn ghost onClick={onClose}>ยกเลิก</Btn>
          <Btn onClick={submit}>{job?'บันทึกการแก้ไข':'สร้างงาน'}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ═══════ JOB DETAIL ═══════ */
function JobDetail({job,state,user,save,onBack}){
  const [tab,setTab]=useState('income');
  const [modals,setModals]=useState({editJob:false,addExp:false,editInc:false});
  const open=k=>setModals(p=>({...p,[k]:true}));
  const close=k=>setModals(p=>({...p,[k]:false}));
  const isAdmin=user.role==='admin';
  const totalInc=(job.income?.deposit?.received?Number(job.income.deposit.amount)||0:0)+(job.income?.remaining?.received?Number(job.income.remaining.amount)||0:0);
  const totalExp=(job.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
  const profit=totalInc-totalExp;
  const totalWages=(job.expenses||[]).filter(e=>e.category==='labor').reduce((s,e)=>s+Number(e.amount||0),0);
  const unreimbursed=(job.expenses||[]).filter(e=>!e.reimbursed);
  const updateJob=async patch=>{
    const jobs=state.jobs.map(j=>j.id===job.id?{...j,...patch}:j);
    await save({jobs});
  };
  const nextStatus=STATUS[job.status]?.next;
  const handleStatusChange=async nst=>{
    if(!isAdmin) return;
    const jobs=state.jobs.map(j=>j.id===job.id?{...j,status:nst,statusAlerts:[]}:j);
    const hist=[{id:uid(),type:'status',desc:`เปลี่ยนสถานะงาน "${job.clientName}" → ${STATUS[nst]?.label}`,userId:user.id,jobId:job.id,createdAt:ts()},...state.hist].slice(0,500);
    const notif={id:uid(),type:'status_change',jobId:job.id,fromUserId:user.id,msg:`Admin อัปเดตสถานะ "${job.clientName}" เป็น ${STATUS[nst]?.label}`,createdAt:ts(),readBy:[]};
    await save({jobs,hist,notifs:[notif,...state.notifs]});
  };
  const handleAlert=async()=>{
    const alerts=[...new Set([...(job.statusAlerts||[]),user.id])];
    let jobs,hist,notifs;
    if(alerts.length>=2&&nextStatus){
      jobs=state.jobs.map(j=>j.id===job.id?{...j,status:nextStatus,statusAlerts:[]}:j);
      const notif={id:uid(),type:'auto_update',jobId:job.id,fromUserId:user.id,msg:`🤖 สถานะ "${job.clientName}" อัปเดตอัตโนมัติเป็น "${STATUS[nextStatus]?.label}" (${alerts.length} คนแจ้ง)`,createdAt:ts(),readBy:[]};
      hist=[{id:uid(),type:'auto',desc:`อัปเดตสถานะอัตโนมัติ "${job.clientName}" → ${STATUS[nextStatus]?.label}`,userId:user.id,jobId:job.id,createdAt:ts()},...state.hist].slice(0,500);
      notifs=[notif,...state.notifs];
    } else if((job.statusAlerts||[]).includes(user.id)){
      alert('คุณแจ้งเตือนไปแล้ว');return;
    } else {
      jobs=state.jobs.map(j=>j.id===job.id?{...j,statusAlerts:alerts}:j);
      const notif={id:uid(),type:'alert',jobId:job.id,fromUserId:user.id,msg:`🔔 ${user.name} ขอให้อัปเดตสถานะ "${job.clientName}" (${alerts.length}/2 คนแจ้ง)`,createdAt:ts(),readBy:[],forAdmin:true};
      hist=[{id:uid(),type:'alert',desc:`${user.name} แจ้งเตือนให้อัปเดตสถานะ "${job.clientName}"`,userId:user.id,jobId:job.id,createdAt:ts()},...state.hist].slice(0,500);
      notifs=[notif,...state.notifs];
    }
    await save({jobs,hist,notifs});
  };
  const toggleReimburse=async expId=>{
    const expenses=(job.expenses||[]).map(e=>e.id===expId?{...e,reimbursed:!e.reimbursed}:e);
    const e=job.expenses.find(x=>x.id===expId);
    const hist=[{id:uid(),type:'reimburse',desc:`${e.reimbursed?'ยกเลิก':'ยืนยัน'}เบิกคืน: ${e.description} ${baht(e.amount)}`,userId:user.id,jobId:job.id,createdAt:ts()},...state.hist].slice(0,500);
    const jobs=state.jobs.map(j=>j.id===job.id?{...j,expenses}:j);
    await save({jobs,hist});
  };
  const deleteExp=async expId=>{
    if(!window.confirm('ลบรายการนี้?')) return;
    const expenses=(job.expenses||[]).filter(e=>e.id!==expId);
    const jobs=state.jobs.map(j=>j.id===job.id?{...j,expenses}:j);
    await save({jobs});
  };
  const uploadSlip=async(field,data)=>{
    const income={...job.income,[field]:{...job.income[field],slipData:data}};
    await updateJob({income});
  };
  const uploadExpSlip=async(expId,data)=>{
    const expenses=(job.expenses||[]).map(e=>e.id===expId?{...e,slipData:data}:e);
    await updateJob({expenses});
  };
  const TABS=[{id:'income',label:'รายรับ 💰'},{id:'expenses',label:'รายจ่าย 🧾'},{id:'reimburse',label:`เบิกคืน ${unreimbursed.length>0?`(${unreimbursed.length})`:''}💼`}];
  return (
    <div>
      <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <button onClick={onBack} style={{background:T.s2,border:`1px solid ${T.bdr}`,borderRadius:8,padding:'8px 14px',color:T.muted,cursor:'pointer',fontSize:13,fontFamily:T.ff}}>← กลับ</button>
        <div style={{flex:1}}>
          <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
            <h1 style={{fontSize:22,fontWeight:700,color:T.text}}>{job.clientName}</h1>
            <Badge c={STATUS[job.status]?.color}>{STATUS[job.status]?.label}</Badge>
          </div>
          <div style={{fontSize:13,color:T.muted,marginTop:4}}>📅 {dtTH(job.eventDate)} {job.theme&&`· ${job.theme}`} · ราคาตกลง {baht(job.agreedPrice)}</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {isAdmin&&<Btn sm ghost onClick={()=>open('editJob')}>✏️ แก้ไข</Btn>}
          {isAdmin&&nextStatus&&<Btn sm onClick={()=>handleStatusChange(nextStatus)} color={STATUS[nextStatus]?.color}>→ {STATUS[nextStatus]?.label}</Btn>}
          {!isAdmin&&job.status!=='done'&&<Btn sm color={T.amber} onClick={handleAlert}>🔔 แจ้งเตือน {(job.statusAlerts||[]).length>0?`(${job.statusAlerts.length}/2)`:''}</Btn>}
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12,marginBottom:20}}>
        <StatCard icon="💰" label="รายรับรวม" value={baht(totalInc)} color={T.green}/>
        <StatCard icon="🧾" label="รายจ่ายรวม" value={baht(totalExp)} color={T.amber}/>
        <StatCard icon="💸" label="ค่าจ้าง" value={baht(totalWages)} color={T.blue}/>
        <StatCard icon="📈" label="กำไรงานนี้" value={baht(profit)} color={profit>=0?T.green:T.red}/>
      </div>
      {job.notes&&<Card style={{background:T.s2}}><p style={{fontSize:13,color:T.muted,marginBottom:2}}>📝 หมายเหตุ</p><p style={{fontSize:14}}>{job.notes}</p></Card>}
      <div style={{display:'flex',gap:4,marginBottom:16,borderBottom:`1px solid ${T.bdr}`}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:'none',border:'none',borderBottom:`2px solid ${tab===t.id?T.gold:'transparent'}`,
            padding:'10px 18px',color:tab===t.id?T.gold:T.muted,fontWeight:tab===t.id?600:400,cursor:'pointer',fontSize:14,fontFamily:T.ff,transition:'all .15s'}}>
            {t.label}
          </button>
        ))}
      </div>
      {tab==='income'&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <h3 style={{fontSize:15,fontWeight:700,color:T.text}}>รายรับ</h3>
            {isAdmin&&<Btn sm onClick={()=>open('editInc')}>✏️ แก้ไขรายรับ</Btn>}
          </div>
          {['deposit','remaining'].map(field=>{
            const inc=job.income?.[field]||{};
            const label=field==='deposit'?'เงินมัดจำ':'ยอดที่เหลือ';
            return (
              <Card key={field}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
                  <div>
                    <div style={{fontSize:13,color:T.muted,marginBottom:4}}>{label}</div>
                    <div style={{fontSize:20,fontWeight:700,color:inc.received?T.green:T.text}}>{baht(inc.amount)}</div>
                    {inc.date&&<div style={{fontSize:12,color:T.muted,marginTop:2}}>รับเมื่อ {dtTH(inc.date)}</div>}
                    <div style={{marginTop:8}}><SlipUpload onUpload={d=>uploadSlip(field,d)} existing={inc.slipData}/></div>
                  </div>
                  <Badge c={inc.received?T.green:T.amber}>{inc.received?'รับแล้ว ✓':'ยังไม่ได้รับ'}</Badge>
                </div>
              </Card>
            );
          })}
        </div>
      )}
      {tab==='expenses'&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <h3 style={{fontSize:15,fontWeight:700}}>รายจ่าย</h3>
            <Btn sm onClick={()=>open('addExp')}>+ เพิ่มรายจ่าย</Btn>
          </div>
          {(job.expenses||[]).length===0?<Empty msg="ยังไม่มีรายจ่าย"/>:
            [...(job.expenses||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>{
              const payer=state.users.find(u=>u.id===e.paidBy);
              return (
                <Card key={e.id} style={{padding:'14px 18px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
                    <div style={{flex:1}}>
                      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:4}}>
                        <span style={{fontWeight:600,fontSize:14}}>{e.description}</span>
                        <Badge c={e.category==='labor'?T.blue:T.amber}>{e.category==='labor'?'💪 ค่าจ้าง':'🛒 วัสดุ'}</Badge>
                        <Badge c={e.reimbursed?T.green:T.red}>{e.reimbursed?'เบิกคืนแล้ว':'รอเบิกคืน'}</Badge>
                      </div>
                      <div style={{fontSize:12,color:T.muted}}>
                        💳 สำรองจ่ายโดย: {payer?.name||'ไม่ระบุ'}
                        {e.workerName&&` · 👤 ${e.workerName}`}
                        {e.date&&` · ${dtTH(e.date)}`}
                      </div>
                      <div style={{marginTop:8}}><SlipUpload onUpload={d=>uploadExpSlip(e.id,d)} existing={e.slipData}/></div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontSize:18,fontWeight:700,color:T.amber}}>{baht(e.amount)}</div>
                      <div style={{display:'flex',gap:6,marginTop:8,justifyContent:'flex-end'}}>
                        {isAdmin&&<Btn sm ghost onClick={()=>toggleReimburse(e.id)}>{e.reimbursed?'↩ ยกเลิก':'✓ เบิกคืน'}</Btn>}
                        {(isAdmin||e.paidBy===user.id)&&<Btn sm danger onClick={()=>deleteExp(e.id)}>ลบ</Btn>}
                      </div>
                    </div>
                  </div>
                </Card>
              );
            })
          }
        </div>
      )}
      {tab==='reimburse'&&(
        <div>
          <h3 style={{fontSize:15,fontWeight:700,marginBottom:14}}>สรุปยอดเบิกคืน</h3>
          {state.users.map(u=>{
            const myExps=(job.expenses||[]).filter(e=>e.paidBy===u.id);
            const pending=myExps.filter(e=>!e.reimbursed);
            const done=myExps.filter(e=>e.reimbursed);
            const pendingAmt=pending.reduce((s,e)=>s+Number(e.amount||0),0);
            const doneAmt=done.reduce((s,e)=>s+Number(e.amount||0),0);
            if(myExps.length===0) return null;
            return (
              <Card key={u.id}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                  <div style={{width:32,height:32,borderRadius:'50%',background:u.color+'33',border:`2px solid ${u.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,color:u.color}}>{u.name.slice(0,1)}</div>
                  <div style={{flex:1,fontWeight:600,fontSize:15}}>{u.name}</div>
                  <div style={{textAlign:'right',display:'flex',gap:6,flexWrap:'wrap'}}>
                    {pendingAmt>0&&<Badge c={T.amber}>รอเบิก {baht(pendingAmt)}</Badge>}
                    {doneAmt>0&&<Badge c={T.green}>เบิกแล้ว {baht(doneAmt)}</Badge>}
                  </div>
                </div>
                {pending.map(e=><div key={e.id} style={{fontSize:12,color:T.muted,padding:'4px 0'}}> · {e.description}: {baht(e.amount)}</div>)}
              </Card>
            );
          })}
          {unreimbursed.length===0&&<Empty msg="ไม่มียอดรอเบิกคืน ✅"/>}
        </div>
      )}
      {modals.editJob&&<JobForm state={state} user={user} save={save} job={job} onClose={()=>close('editJob')}/>}
      {modals.addExp&&<ExpenseForm state={state} user={user} save={save} job={job} onClose={()=>close('addExp')}/>}
      {modals.editInc&&<IncomeForm state={state} user={user} save={save} job={job} onClose={()=>close('editInc')}/>}
    </div>
  );
}

function IncomeForm({job,state,user,save,onClose}){
  const [inc,setInc]=useState({
    deposit:{amount:job.income?.deposit?.amount||0,date:job.income?.deposit?.date||'',received:job.income?.deposit?.received||false,slipData:job.income?.deposit?.slipData||null},
    remaining:{amount:job.income?.remaining?.amount||0,date:job.income?.remaining?.date||'',received:job.income?.remaining?.received||false,slipData:job.income?.remaining?.slipData||null},
  });
  const set=(field,k)=>e=>setInc(p=>({...p,[field]:{...p[field],[k]:e.target.value}}));
  const toggle=field=>setInc(p=>({...p,[field]:{...p[field],received:!p[field].received}}));
  const submit=async()=>{
    const jobs=state.jobs.map(j=>j.id===job.id?{...j,income:inc}:j);
    const hist=[{id:uid(),type:'income',desc:`อัปเดตรายรับ งาน: ${job.clientName}`,userId:user.id,jobId:job.id,createdAt:ts()},...state.hist].slice(0,500);
    await save({jobs,hist});
    onClose();
  };
  return (
    <Modal title="แก้ไขรายรับ" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {['deposit','remaining'].map(field=>{
          const label=field==='deposit'?'เงินมัดจำ':'ยอดที่เหลือ';
          return (
            <div key={field} style={{background:T.s2,borderRadius:10,padding:'14px'}}>
              <div style={{fontWeight:600,fontSize:14,marginBottom:10,color:T.gold}}>{label}</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <Inp label="จำนวนเงิน (บาท)" type="number" value={inc[field].amount} onChange={set(field,'amount')} min="0" step="100"/>
                <Inp label="วันที่รับ" type="date" value={inc[field].date} onChange={set(field,'date')}/>
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:14}}>
                  <input type="checkbox" checked={inc[field].received} onChange={()=>toggle(field)} style={{width:16,height:16,accentColor:T.gold}}/>
                  <span>รับเงินแล้ว</span>
                </label>
              </div>
            </div>
          );
        })}
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <Btn ghost onClick={onClose}>ยกเลิก</Btn>
          <Btn onClick={submit}>บันทึก</Btn>
        </div>
      </div>
    </Modal>
  );
}

function ExpenseForm({job,state,user,save,onClose}){
  const [f,setF]=useState({category:'material',description:'',amount:'',paidBy:user.id,workerName:'',date:new Date().toISOString().split('T')[0]});
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const submit=async()=>{
    if(!f.description){alert('กรุณากรอกรายการ');return;}
    if(!f.amount){alert('กรุณากรอกจำนวนเงิน');return;}
    const ne={id:uid(),createdAt:ts(),reimbursed:false,slipData:null,...f,amount:Number(f.amount)};
    const expenses=[...(job.expenses||[]),ne];
    const jobs=state.jobs.map(j=>j.id===job.id?{...j,expenses}:j);
    const hist=[{id:uid(),type:'expense',desc:`เพิ่มรายจ่าย: ${f.description} ${baht(f.amount)}`,userId:user.id,jobId:job.id,amount:Number(f.amount),createdAt:ts()},...state.hist].slice(0,500);
    await save({jobs,hist});
    onClose();
  };
  return (

        {f.category==='labor'&&<Inp label="ชื่อผู้รับจ้าง (ถ้ามี)" value={f.workerName} onChange={set('workerName')} placeholder="ชื่อลูกจ้าง"/>}
        <Inp label="วันที่" type="date" value={f.date} onChange={set('date')}/>

/* ═══════ DIVIDENDS ═══════ */
function Dividends({state,user,save}){
  const [showForm,setShowForm]=useState(false);
  const {users,jobs,divs}=state;
  const totalIncome=jobs.reduce((s,j)=>s+(j.income?.deposit?.received?Number(j.income.deposit.amount)||0:0)+(j.income?.remaining?.received?Number(j.income.remaining.amount)||0:0),0);
  const totalExp=jobs.reduce((s,j)=>s+(j.expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0),0);
  const profit=totalIncome-totalExp;
  const paidDiv=divs.reduce((s,d)=>s+(d.shares||[]).reduce((a,x)=>a+Number(x.amount||0),0),0);
  const remaining=profit-paidDiv;
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h1 style={{fontSize:22,fontWeight:700,color:T.gold}}>การปันผล</h1><p style={{color:T.muted,fontSize:13}}>{divs.length} รอบ</p></div>
        {user.role==='admin'&&<Btn onClick={()=>setShowForm(true)}>+ สร้างรอบปันผล</Btn>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:14,marginBottom:20}}>
        <StatCard icon="📈" label="กำไรสุทธิรวม" value={baht(profit)} color={T.green}/>
        <StatCard icon="💸" label="ปันผลแล้วทั้งหมด" value={baht(paidDiv)} color={T.amber}/>
        <StatCard icon="💰" label="คงเหลือ" value={baht(remaining)} color={remaining>0?T.blue:T.red}/>
      </div>
      {divs.length===0?<Empty msg="ยังไม่มีรอบปันผล"/>:
        [...divs].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(d=>(
          <Card key={d.id}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:12,flexWrap:'wrap',gap:8}}>
              <div><div style={{fontWeight:700,fontSize:16}}>รอบ {dtTH(d.date)}</div>{d.notes&&<div style={{fontSize:12,color:T.muted,marginTop:2}}>{d.notes}</div>}</div>
              <div style={{fontWeight:700,fontSize:16,color:T.gold}}>{baht(d.totalAmount)}</div>
            </div>
            <Sep/>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10}}>
              {(d.shares||[]).map(x=>{
                const u=users.find(u=>u.id===x.uid);
                return u?(
                  <div key={x.uid} style={{background:T.s2,borderRadius:8,padding:'10px 12px',display:'flex',alignItems:'center',gap:8}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:u.color+'33',border:`2px solid ${u.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,color:u.color}}>{u.name.slice(0,1)}</div>
                    <div><div style={{fontSize:13,fontWeight:600}}>{u.name}</div><div style={{fontSize:14,fontWeight:700,color:T.green}}>{baht(x.amount)}</div></div>
                  </div>
                ):null;
              })}
            </div>
            {(d.wages||[]).length>0&&(
              <><Sep/>
              <div style={{fontSize:12,color:T.muted,marginBottom:6}}>ค่าจ้างผู้ถือหุ้น</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {d.wages.map(w=>{const u=users.find(x=>x.id===w.uid);return u?<Badge key={w.uid} c={T.blue}>{u.name}: {baht(w.amount)}</Badge>:null;})}
              </div></>
            )}
          </Card>
        ))
      }
      {showForm&&<DividendForm state={state} user={user} save={save} onClose={()=>setShowForm(false)} profit={profit} paidDiv={paidDiv}/>}
    </div>
  );
}

function DividendForm({state,user,save,onClose,profit,paidDiv}){
  const remaining=profit-paidDiv;
  const [date,setDate]=useState(new Date().toISOString().split('T')[0]);
  const [total,setTotal]=useState(Math.max(0,remaining).toString());
  const [notes,setNotes]=useState('');
  const [wages,setWages]=useState(state.users.map(u=>({uid:u.id,amount:'0',include:false})));
  const totalNum=Number(total)||0;
  const shares=state.users.map(u=>({uid:u.id,amount:Math.round(totalNum*u.share/100)}));
  const setWage=(uid,k,v)=>setWages(p=>p.map(w=>w.uid===uid?{...w,[k]:v}:w));
  const submit=async()=>{
    if(!total||totalNum<=0){alert('กรอกยอดปันผล');return;}
    const nd={id:uid(),date,totalAmount:totalNum,notes,shares,wages:wages.filter(w=>w.include&&Number(w.amount)>0).map(w=>({...w,amount:Number(w.amount)})),createdAt:ts(),createdBy:user.id};
    const hist=[{id:uid(),type:'dividend',desc:`ปันผลรอบ ${dtTH(date)} ยอดรวม ${baht(totalNum)}`,userId:user.id,amount:totalNum,createdAt:ts()},...state.hist].slice(0,500);
    await save({divs:[nd,...state.divs],hist});
    onClose();
  };
  return (
    <Modal title="สร้างรอบปันผล" onClose={onClose}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <Inp label="วันที่" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        <Inp label="ยอดปันผลรวม (บาท)" type="number" value={total} onChange={e=>setTotal(e.target.value)} min="0"/>
        <Inp label="หมายเหตุ" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="รอบปันผลนี้..."/>
        <div style={{background:T.s2,borderRadius:10,padding:14}}>
          <p style={{fontSize:13,color:T.muted,marginBottom:8}}>แบ่งตามสัดส่วนหุ้น</p>
          {state.users.map(u=>{const share=shares.find(x=>x.uid===u.id);return(
            <div key={u.id} style={{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:14}}>
              <span style={{color:u.color}}>{u.name} ({u.share}%)</span>
              <span style={{fontWeight:600,color:T.green}}>{baht(share?.amount||0)}</span>
            </div>
          );})}
        </div>
        <div style={{background:T.s2,borderRadius:10,padding:14}}>
          <p style={{fontSize:13,color:T.muted,marginBottom:8}}>ค่าจ้างผู้ถือหุ้น (ถ้ามี)</p>
          {wages.map(w=>{const u=state.users.find(x=>x.id===w.uid);return(
            <div key={w.uid} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <input type="checkbox" checked={w.include} onChange={e=>setWage(w.uid,'include',e.target.checked)} style={{width:16,height:16,accentColor:T.gold}}/>
              <span style={{fontSize:13,width:70,color:u.color}}>{u.name}</span>
              {w.include&&<input type="number" value={w.amount} onChange={e=>setWage(w.uid,'amount',e.target.value)} min="0" placeholder="0"
                style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:6,padding:'5px 8px',color:T.text,fontSize:13,width:100,fontFamily:T.ff}}/>}
            </div>
          );})}
        </div>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <Btn ghost onClick={onClose}>ยกเลิก</Btn>
          <Btn onClick={submit}>บันทึกปันผล</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ═══════ HISTORY ═══════ */
function History({state}){
  const {hist,jobs,users}=state;
  const TYPES={create:{c:T.blue,i:'🆕'},edit:{c:T.muted,i:'✏️'},income:{c:T.green,i:'💰'},expense:{c:T.amber,i:'🧾'},reimburse:{c:T.blue,i:'💼'},status:{c:T.gold,i:'🔄'},alert:{c:T.amber,i:'🔔'},auto:{c:T.gold,i:'🤖'},dividend:{c:T.gold,i:'💸'},default:{c:T.muted,i:'📌'}};
  const exportAll=()=>{
    const rows=[['วันที่','ประเภท','รายการ','จำนวน','ผู้ดำเนินการ','งาน']];
    hist.forEach(h=>{const u=users.find(x=>x.id===h.userId);const j=h.jobId?jobs.find(x=>x.id===h.jobId):null;rows.push([dtFull(h.createdAt),h.type,h.desc,h.amount||'',u?.name||'',j?.clientName||'']);});
    exportCSV(rows,'history.csv');
  };
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h1 style={{fontSize:22,fontWeight:700,color:T.gold}}>ประวัติการเคลื่อนไหว</h1><p style={{color:T.muted,fontSize:13}}>{hist.length} รายการ</p></div>
        <Btn ghost sm onClick={exportAll}>⬇ Export CSV</Btn>
      </div>
      {hist.length===0?<Empty/>:hist.map(h=>{
        const t=TYPES[h.type]||TYPES.default;
        const u=users.find(x=>x.id===h.userId);
        const j=h.jobId?jobs.find(x=>x.id===h.jobId):null;
        return (
          <div key={h.id} style={{display:'flex',gap:12,alignItems:'flex-start',padding:'12px 0',borderBottom:`1px solid ${T.bdr}`}}>
            <div style={{width:32,height:32,borderRadius:8,background:t.c+'22',border:`1px solid ${t.c}44`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>{t.i}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14}}>{h.desc}</div>
              <div style={{fontSize:11,color:T.muted,marginTop:3}}>{dtFull(h.createdAt)} · {u?.name||'ระบบ'}{j&&<span style={{color:T.gold}}> · {j.clientName}</span>}</div>
            </div>
            {h.amount>0&&<div style={{fontSize:14,fontWeight:600,color:t.c,whiteSpace:'nowrap'}}>{baht(h.amount)}</div>}
          </div>
        );
      })}
    </div>
  );
}

/* ═══════ NOTIFICATIONS ═══════ */
function Notifications({state,user,save}){
  const myNotifs=state.notifs.filter(n=>!n.forAdmin||(n.forAdmin&&user.role==='admin'));
  const markRead=async id=>{const ns=state.notifs.map(n=>n.id===id?{...n,readBy:[...(n.readBy||[]),user.id]}:n);await save({notifs:ns});};
  const markAll=async()=>{const ns=state.notifs.map(n=>({...n,readBy:[...(n.readBy||[]),...(!n.readBy?.includes(user.id)?[user.id]:[])]}));await save({notifs:ns});};
  const unread=myNotifs.filter(n=>!(n.readBy||[]).includes(user.id));
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div><h1 style={{fontSize:22,fontWeight:700,color:T.gold}}>การแจ้งเตือน</h1><p style={{color:T.muted,fontSize:13}}>{unread.length} ยังไม่ได้อ่าน</p></div>
        {unread.length>0&&<Btn sm ghost onClick={markAll}>อ่านทั้งหมด</Btn>}
      </div>
      {myNotifs.length===0?<Empty msg="ไม่มีการแจ้งเตือน"/>:
        [...myNotifs].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(n=>{
          const isRead=(n.readBy||[]).includes(user.id);
          const icon={alert:'🔔',auto_update:'🤖',status_change:'🔄'}[n.type]||'📌';
          const c={alert:T.amber,auto_update:T.gold,status_change:T.blue}[n.type]||T.muted;
          return (
            <div key={n.id} onClick={()=>markRead(n.id)} style={{background:isRead?T.s1:T.s2,border:`1px solid ${isRead?T.bdr:c+'55'}`,borderRadius:12,padding:'14px 16px',marginBottom:10,cursor:'pointer',transition:'all .15s',opacity:isRead?.7:1}}>
              <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                <span style={{fontSize:18}}>{icon}</span>
                <div style={{flex:1}}><p style={{fontSize:14,marginBottom:4,color:isRead?T.muted:T.text}}>{n.msg}</p><p style={{fontSize:11,color:T.dim}}>{dtFull(n.createdAt)}</p></div>
                {!isRead&&<div style={{width:8,height:8,borderRadius:'50%',background:c,flexShrink:0,marginTop:5}}/>}
              </div>
            </div>
          );
        })
      }
    </div>
  );
}

/* ═══════ SETTINGS ═══════ */
function Settings({state,user,save,setUser}){
  const [users,setUsers]=useState(state.users.map(u=>({...u})));
  const isAdmin=user.role==='admin';
  const set=(id,k)=>e=>setUsers(p=>p.map(u=>u.id===id?{...u,[k]:e.target.value}:u));
  const setRole=(id,role)=>setUsers(p=>p.map(u=>u.id===id?{...u,role}:u));
  const totalShare=users.reduce((s,u)=>s+Number(u.share||0),0);
  const submit=async()=>{
    if(Math.abs(totalShare-100)>0.01){alert(`สัดส่วนหุ้นรวมต้องได้ 100% (ปัจจุบัน: ${totalShare}%)`);return;}
    await save({users});
    const me=users.find(u=>u.id===user.id);
    if(me) setUser(me);
    alert('บันทึกการตั้งค่าสำเร็จ');
  };
  const exportAll=()=>{
    const rows=[['ชื่อลูกค้า','วันงาน','ราคาตกลง','รายรับ','รายจ่าย','กำไร','สถานะ']];
    state.jobs.forEach(j=>{
      const inc=(j.income?.deposit?.received?Number(j.income.deposit.amount)||0:0)+(j.income?.remaining?.received?Number(j.income.remaining.amount)||0:0);
      const exp=(j.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
      rows.push([j.clientName,dtTH(j.eventDate),j.agreedPrice,inc,exp,inc-exp,STATUS[j.status]?.label]);
    });
    exportCSV(rows,'jobs-report.csv');
  };
  return (
    <div>
      <h1 style={{fontSize:22,fontWeight:700,color:T.gold,marginBottom:20}}>ตั้งค่า</h1>
      <Card>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h3 style={{fontSize:15,fontWeight:700}}>👥 ผู้ถือหุ้น & สิทธิ์</h3>
          <span style={{fontSize:13,color:totalShare===100?T.green:T.red,fontWeight:600}}>รวม {totalShare}%</span>
        </div>
        {users.map(u=>(
          <div key={u.id} style={{background:T.s2,borderRadius:10,padding:'14px 16px',marginBottom:12}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,flexWrap:'wrap'}}>
              <div style={{width:32,height:32,borderRadius:'50%',background:u.color+'33',border:`2px solid ${u.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,color:u.color}}>{u.name.slice(0,1)}</div>
              <span style={{fontWeight:600,fontSize:15,flex:1}}>{u.name}</span>
              {isAdmin&&(
                <div style={{display:'flex',gap:6}}>
                  <button onClick={()=>setRole(u.id,'admin')} style={{background:u.role==='admin'?T.gold+'33':'transparent',border:`1px solid ${u.role==='admin'?T.gold:T.bdr}`,borderRadius:6,padding:'4px 10px',color:u.role==='admin'?T.gold:T.muted,cursor:'pointer',fontSize:11,fontFamily:T.ff}}>Admin</button>
                  <button onClick={()=>setRole(u.id,'member')} style={{background:u.role==='member'?T.blue+'33':'transparent',border:`1px solid ${u.role==='member'?T.blue:T.bdr}`,borderRadius:6,padding:'4px 10px',color:u.role==='member'?T.blue:T.muted,cursor:'pointer',fontSize:11,fontFamily:T.ff}}>Member</button>
                </div>
              )}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              {isAdmin&&<Inp label="PIN" type="password" value={u.pin} onChange={set(u.id,'pin')} placeholder="••••"/>}
              <Inp label="% หุ้น" type="number" value={u.share} onChange={set(u.id,'share')} min="0" max="100" step="0.5"/>
            </div>
          </div>
        ))}
        {isAdmin&&<div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}><Btn onClick={submit}>💾 บันทึกการตั้งค่า</Btn></div>}
      </Card>
      <Card>
        <h3 style={{fontSize:15,fontWeight:700,marginBottom:14}}>📥 Export ข้อมูล</h3>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <Btn ghost onClick={exportAll}>⬇ Export รายงานงาน (CSV)</Btn>
          <Btn ghost onClick={()=>{
            const rows=[['วันที่','ประเภท','รายการ','จำนวน','ผู้ดำเนินการ']];
            state.hist.forEach(h=>{const u=state.users.find(x=>x.id===h.userId);rows.push([dtFull(h.createdAt),h.type,h.desc,h.amount||'',u?.name||'']);});
            exportCSV(rows,'history.csv');
          }}>⬇ Export ประวัติ (CSV)</Btn>
        </div>
      </Card>
      <Card>
        <h3 style={{fontSize:15,fontWeight:700,marginBottom:12}}>ℹ️ เกี่ยวกับ</h3>
        <p style={{color:T.muted,fontSize:13}}>Backdrop Studio Business App · ข้อมูลเก็บใน Firebase Realtime Database · ทุกคนในกลุ่มเห็นข้อมูลเดียวกันแบบ real-time</p>
        <p style={{color:T.muted,fontSize:12,marginTop:6}}>🔔 ระบบอัปเดตสถานะอัตโนมัติ: หากสมาชิก 2 คนขึ้นไปกดแจ้งเตือน สถานะจะเลื่อนไปยังขั้นต่อไปโดยอัตโนมัติ</p>
      </Card>
    </div>
  );
}

/* ═══════ ROOT APP ═══════ */
function App(){
  const [state,setState]=useState(null);
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  const [jobId,setJobId]=useState(null);
  const [loading,setLoading]=useState(true);
  const [fbError,setFbError]=useState(null);

  useEffect(()=>{
    const init = async () => {
      try {
        const users = await DB.get('users') || SEED_USERS;
        const jobs  = await DB.get('jobs')  || [];
        const divs  = await DB.get('divs')  || [];
        const notifs= await DB.get('notifs')|| [];
        const hist  = await DB.get('hist')  || [];
        // seed users if first time
        const existing = await DB.get('users');
        if(!existing) await DB.set('users', SEED_USERS);
        setState({users,jobs,divs,notifs,hist});
        setLoading(false);
      } catch(e) {
        setFbError(e.message||'เชื่อมต่อ Firebase ไม่ได้');
        setLoading(false);
      }
    };
    if(window._fbReady){ init(); }
    else { window.addEventListener('fb-ready', init, {once:true}); }
  },[]);

  const save=async patches=>{
    const next={...state,...patches};
    setState(next);
    for(const [k,v] of Object.entries(patches)) await DB.set(k,v);
    return next;
  };

  if(loading) return (
    <div style={{minHeight:'100vh',background:T.bg,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:14}}>
      <Spin/>
      <div style={{color:T.muted,fontSize:14}}>กำลังโหลด...</div>
    </div>
  );

  if(fbError) return (
    <div style={{minHeight:'100vh',background:T.bg,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:14,padding:20}}>
      <div style={{fontSize:40}}>🔥</div>
      <div style={{color:T.red,fontSize:18,fontWeight:700}}>เชื่อมต่อ Firebase ไม่ได้</div>
      <div style={{color:T.muted,fontSize:14}}>{fbError}</div>
      <div style={{background:T.s2,border:`1px solid ${T.bdr}`,borderRadius:10,padding:'14px 20px',fontSize:13,color:T.amber,maxWidth:400,textAlign:'center'}}>
        แก้ไข Rules ใน Firebase Console:<br/>
        <code style={{color:T.text}}>{'{ "rules": { ".read": true, ".write": true } }'}</code>
      </div>
    </div>
  );

  if(!user) return <LoginPage users={state.users} onLogin={setUser}/>;

  const unread=state.notifs.filter(n=>!(n.readBy||[]).includes(user.id)&&(!n.forAdmin||(n.forAdmin&&user.role==='admin'))).length;

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar page={page} setPage={p=>{setPage(p);if(p!=='jobs')setJobId(null);}} user={user} onLogout={()=>setUser(null)} unread={unread}/>
      <main style={{flex:1,overflow:'auto',padding:'28px 30px',background:T.bg}}>
        {page==='dashboard'&&<Dashboard state={state} user={user} save={save} setPage={setPage} setJobId={setJobId}/>}
        {page==='jobs'&&<Jobs state={state} user={user} save={save} jobId={jobId} setJobId={setJobId}/>}
        {page==='divs'&&<Dividends state={state} user={user} save={save}/>}
        {page==='hist'&&<History state={state} user={user} save={save}/>}
        {page==='notifs'&&<Notifications state={state} user={user} save={save}/>}
        {page==='settings'&&<Settings state={state} user={user} save={save} setUser={setUser}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
